apiVersion: apps/v1
kind: Deployment
metadata:
  name: gha-cicd-demo
  namespace: qa
  labels:
    app: gha-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gha-cicd-demo
  template:
    metadata:
      labels:
        app: gha-cicd-demo
    spec:
      containers:
        - name: gha-cicd-demo
          image: ghcr.io/goswami97/gha-cicd-demo:a0beafdebda236e0f105cb052eab7d1afdeb1209
          env:
            - name: DEPLOY_ENV
              value: qa
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
